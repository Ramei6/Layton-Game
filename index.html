<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Inspector Dasha in Venice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="game-wrapper">
    <div id="game-container">

      <!-- ══ TITLE SCREEN ══ -->
  <!-- ══ TITLE SCREEN ══ -->
        <div id="screen-title" class="screen">

          <!-- PATH B ONLY: cover baked-in texts with patches matching background -->
          <!-- Delete these two divs if you regenerated a clean image (Path A) -->
          <div id="title-cover-subtitle"></div>
          <div id="title-cover-press"></div>

          <!-- Animated HTML subtitle overlay -->
          <h1 id="title-subtitle" data-text="A trip in Venice">A trip in Venice</h1>
          <div id="title-press-start">✦ PRESS START ✦</div>

        </div>
        <!-- ══ INTRO SCREEN ══ -->
        <div id="screen-intro" class="screen">

          <!-- Background image, fades between scenes -->
          <img id="intro-background" src="" alt="">

          <!-- Narrator text overlay — sits at bottom, shown/hidden by JS -->
          <div id="narrator-overlay">
            <div id="narrator-label">— Narrator —</div>
            <p id="narrator-text"></p>
            <div id="narrator-advance">▼</div>
          </div>

        </div>

      <!-- ══ SCENE SCREEN (reused for all scenes) ══ -->
      <div id="screen-scene" class="screen">
        <img id="scene-background" src="" alt="">
        <div id="scene-sprites"></div>
        <div id="scene-hotspots"></div>
        <div id="scene-location-tag"></div>
      </div>

      <!-- ══ PUZZLE SCREEN (reused for all puzzles) ══ -->
      <div id="screen-puzzle" class="screen">
        <div id="puzzle-header">
          <span id="puzzle-number"></span>
          <span id="puzzle-title-text"></span>
        </div>
        <div id="puzzle-body">
          <div id="puzzle-left-panel">
            <div id="puzzle-description"></div>
            <div id="puzzle-hint-area">
              <button id="puzzle-hint-btn">💡 Use Hint</button>
              <div id="puzzle-hint-text" class="hidden"></div>
            </div>
          </div>
          <div id="puzzle-right-panel">
            <!-- Puzzle-specific UI injected here -->
          </div>
        </div>
        <div id="puzzle-footer">
          <button id="puzzle-submit-btn">Submit Answer</button>
        </div>
        <!-- Result overlay (shown on correct/wrong) -->
        <div id="puzzle-result" class="hidden">
          <div id="puzzle-result-inner">
            <div id="puzzle-result-text"></div>
            <button id="puzzle-result-btn">Continue</button>
          </div>
        </div>
      </div>

      <!-- ══ END SCREEN ══ -->
      <div id="screen-end" class="screen">
        <div id="end-content">
          <h1 id="end-title">Happy Birthday!</h1>
          <div id="end-characters"></div>
          <p id="end-message"></p>
        </div>
      </div>

      <!-- ══ DIALOGUE OVERLAY ══ -->
      <div id="dialogue-overlay">

        <!-- Portrait — bigger, above box top-left corner -->
        <div id="dialogue-portrait-container">
          <img id="dialogue-portrait-img" src="" alt="">
        </div>

        <!-- Parchment box -->
        <div id="dialogue-box">

          <!-- Name tab — child of box, floats above via negative top -->
          <div id="dialogue-name-tab">
            <span id="dialogue-speaker-name"></span>
            <div id="cat-companion" class="hidden">🐱</div>
          </div>

          <!-- Content -->
          <div id="dialogue-text-content"></div>

          <!-- Pencil replaces ▼ -->
          <img id="dialogue-advance-pencil" src="assets/ui/pencil-icon.png" alt="">

        </div>

      </div>

      <!-- ══ HUD (hint coin counter, always on top) ══ -->
      <div id="hud" class="hidden">
        <div id="hint-coin-counter">
          <div id="hintcoin-icon">🪙</div>
          <span id="hint-count">0</span>
        </div>
      </div>

      <!-- ══ LOADING INDICATOR ══ -->
      <div id="loading-indicator">
        <div id="loading-sprite"></div>
        <div id="loading-text">
          Investigating<span class="dot" id="dot1">.</span><span
          class="dot" id="dot2">.</span><span class="dot" id="dot3">.</span>
        </div>
      </div>
    </div><!-- /game-container -->
  </div><!-- /game-wrapper -->

  <!-- GSAP (animation library) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>window.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG') {
    console.error('BROKEN IMAGE:', {
      src: e.target.src,
      id: e.target.id,
      class: e.target.className,
      time: performance.now().toFixed(0) + 'ms'
    });
  }
}, true);</script>

  <!-- Load order matters: dependencies first -->
  <script src="js/state.js"></script>
  <script src="js/scene-manager.js"></script>
  <script src="js/dialogue.js"></script>^
  <script src="js/loading-indicator.js"></script>
  <script src="js/puzzle-shell.js"></script>

  <!-- Puzzles (loaded before scenes because scenes call puzzle.open()) -->
  <script src="js/puzzles/puzzle1-crossing.js"></script>
  <script src="js/puzzles/puzzle2-pigeons.js"></script>
  <script src="js/puzzles/puzzle3-map.js"></script>
  <script src="js/puzzles/puzzle4-recipe.js"></script>

  <!-- Scenes -->
  <script src="js/scenes/scene-title.js"></script>
  <script src="js/scenes/scene-intro.js"></script>
  <script src="js/scenes/scene1-bridge.js"></script>
  <script src="js/scenes/scene2-stmarco.js"></script>
  <script src="js/scenes/scene3-restaurant.js"></script>
  <script src="js/scenes/scene-end.js"></script>
  <script src="js/debug-menu.js"></script>
  <script src="js/game.js"></script>

  <!-- Entry point: runs after all scripts loaded -->
  <script src="js/game.js"></script>

</body>
</html>
